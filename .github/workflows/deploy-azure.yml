name: Deploy to Azure App Service

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ai-acc-coding-poc
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Create deployment package
      run: |
        zip -r deploy.zip . -x "*.git*" "*.github*" "_internal/*" "deliverables/*" "3_examples/*" "tests/*" "*.md" "docker-compose.yml" "Dockerfile"

    - name: Deploy using Kudu REST API (bypass Oryx auto-detection)
      run: |
        DEPLOYMENT_URL="https://\$ai-acc-coding-poc:$(az webapp deployment list-publishing-credentials --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ai-account-coding --query publishingPassword -o tsv)@ai-acc-coding-poc-fhg9e0bphrdab8b8.scm.westeurope-01.azurewebsites.net/api/zipdeploy"
        
        curl -X POST "$DEPLOYMENT_URL" \
          --data-binary @deploy.zip \
          -H "Content-Type: application/octet-stream" \
          --max-time 300 \
          --fail-with-body || (echo "Deployment failed" && exit 1)
    
    - name: Restart app and check health
      run: |
        echo "Restarting app..."
        az webapp restart --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ai-account-coding
        
        APP_URL=$(az webapp show --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ai-account-coding --query defaultHostName -o tsv)
        echo "✅ Deployment completed"
        echo "🌐 App URL: https://$APP_URL"
        echo "🔍 Health check: https://$APP_URL/health"
        
        echo "Waiting for app to start..."
        sleep 45
        
        for i in {1..5}; do
          if curl -f -s https://$APP_URL/health > /dev/null 2>&1; then
            echo "✅ Health check passed!"
            exit 0
          fi
          echo "Attempt $i failed, retrying..."
          sleep 10
        done
        
        echo "⚠️ Health check failed after 5 attempts - check logs"
        az webapp log tail --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ai-account-coding --lines 50
        exit 1
