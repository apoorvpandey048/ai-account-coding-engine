name: CI/CD — Deploy to Azure Web App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests (non-blocking)
        run: |
          if [ -f pytest.ini ] || [ -d tests ]; then pytest -q || true; fi

      - name: Create deploy package
        run: |
          zip -r deploy.zip src requirements.txt startup.sh data/Kontoplan.csv 3_examples || zip -r deploy.zip src || true

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ai-acc-coding-poc
          package: deploy.zip
name: Deploy to Azure App Service

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ai-acc-coding-poc
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Restore app settings
      run: |
        az webapp config appsettings set \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ai-account-coding \
          --settings \
            STORAGE_ACCOUNT_NAME=aiacctcodingst01 \
            CONTAINER_RAW=raw-invoices \
            CONTAINER_PROCESSED=processed \
            CONTAINER_FEEDBACK=feedback \
            AZURE_OPENAI_ENDPOINT=https://a-i-1.openai.azure.com \
            AZURE_OPENAI_DEPLOYMENT_NAME=gpt-4-1-mini \
            AZURE_OPENAI_MODEL=gpt-4.1-mini \
            AZURE_OPENAI_API_VERSION=2024-08-01-preview \
            AZURE_OPENAI_MAX_INPUT_TOKENS=3000000 \
            AZURE_OPENAI_MAX_CACHED_INPUT_TOKENS=1200000 \
            AZURE_OPENAI_MAX_OUTPUT_TOKENS=1000000 \
            AZURE_OPENAI_TEMPERATURE=0.3 \
            AZURE_OPENAI_TOP_P=1.0 \
            AZURE_OPENAI_KEY="${{ secrets.AZURE_OPENAI_KEY }}" \
            VALID_API_KEYS=dev-key-001 \
            API_KEY_REQUIRED=true \
            ENABLE_ORYX_BUILD=true \
            SCM_DO_BUILD_DURING_DEPLOYMENT=true \
            WEBSITES_PORT=8000

    - name: Create deployment package
      run: |
        zip -r deploy.zip . -x "*.git*" "*.github*" "_internal/*" "deliverables/*" "3_examples/*" "tests/*" "*.md" "docker-compose.yml" "Dockerfile"

    - name: Deploy using Azure CLI
      run: |
        echo "Creating deployment package..."
        ls -la deploy.zip
        
        echo "Deploying via Azure CLI..."
        az webapp deploy \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ai-account-coding \
          --src-path deploy.zip \
          --type zip \
          --timeout 300
        
        echo "✅ Deployment completed"
    
    - name: Restart app and check health
      run: |
        echo "Restarting app..."
        az webapp restart --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ai-account-coding
        
        APP_URL=$(az webapp show --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ai-account-coding --query defaultHostName -o tsv)
        echo "✅ Deployment completed"
        echo "🌐 App URL: https://$APP_URL"
        echo "🔍 Health check: https://$APP_URL/health"
        
        echo "Waiting for app to start..."
        sleep 45
        
        for i in {1..5}; do
          if curl -f -s https://$APP_URL/health > /dev/null 2>&1; then
            echo "✅ Health check passed!"
            exit 0
          fi
          echo "Attempt $i failed, retrying..."
          sleep 10
        done
        
        echo "⚠️ Health check failed after 5 attempts - check logs"
        az webapp log tail --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ai-account-coding --lines 50
        exit 1
