name: Deploy to Azure App Service

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ai-acc-coding-poc
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Configure App Service for Python runtime
      run: |
        # Clear any container config first
        az webapp config container delete \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ai-account-coding || true
        
        # Set Python runtime explicitly
        az webapp config set \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ai-account-coding \
          --linux-fx-version "PYTHON|${{ env.PYTHON_VERSION }}" \
          --startup-file "python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000"
        
        # Enable build during deployment
        az webapp config appsettings set \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ai-account-coding \
          --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true WEBSITES_PORT=8000

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: .
    
    - name: Deployment summary & health check
      run: |
        echo "✅ Deployment completed"
        APP_URL=$(az webapp show --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group ai-account-coding --query defaultHostName -o tsv)
        echo "🌐 App URL: https://$APP_URL"
        echo "🔍 Health check: https://$APP_URL/health"
        sleep 30
        curl -f https://$APP_URL/health || echo "⚠️  Health check failed - check logs"
