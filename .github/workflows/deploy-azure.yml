name: Deploy to Azure App Service

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ai-acc-coding-poc
  PYTHON_VERSION: '3.11'
  ACR_NAME: aiacctacr01

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build and push image with ACR Tasks
      env:
        ACR_NAME: ${{ env.ACR_NAME }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build the Docker image in Azure (ACR Tasks) and push to the registry
        az acr build --registry $ACR_NAME --image ai-account-coding:${IMAGE_TAG} --file Dockerfile .

    - name: Configure Web App to use ACR image
      env:
        AZURE_WEBAPP_NAME: ${{ env.AZURE_WEBAPP_NAME }}
        ACR_NAME: ${{ env.ACR_NAME }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Point the Web App to the image we just pushed
        az webapp config container set \
          --name $AZURE_WEBAPP_NAME \
          --resource-group ai-account-coding \
          --docker-custom-image-name $ACR_NAME.azurecr.io/ai-account-coding:${IMAGE_TAG} \
          --docker-registry-server-url https://$ACR_NAME.azurecr.io

        # Restart the app to pick up the new image
        az webapp restart --name $AZURE_WEBAPP_NAME --resource-group ai-account-coding
    
    - name: Deployment summary & health check
      env:
        AZURE_WEBAPP_NAME: ${{ env.AZURE_WEBAPP_NAME }}
      run: |
        echo "✅ Deployment steps completed"
        echo "🌐 App URL: https://$(az webapp show --name $AZURE_WEBAPP_NAME --resource-group ai-account-coding --query defaultHostName -o tsv)"
        echo "🔍 Health check: https://$(az webapp show --name $AZURE_WEBAPP_NAME --resource-group ai-account-coding --query defaultHostName -o tsv)/health"
