version: '3.8'

services:
  api:
    build: .
    container_name: account-coding-api
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=ai-account-coding-service
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - API_KEY_REQUIRED=true
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./feedback_log.jsonl:/app/feedback_log.jsonl
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
